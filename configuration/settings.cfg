["ftp_pgn[0]"]
description = "Destination FTP URL with username and password and up to two placeholders for tournament identifier (e. g. `2022-dem-u18`) where PGN files are uploaded to"
scope[] = tournaments
example[] = "ftp_pgn[0]=ftp://user:pass@host/%s/%s/games.pgn"

["ftp_other[0][dest]"]
description = "Destination FTP URL with username and password to where other files are uploaded"
scope[] = tournaments
example[] = "ftp_other[0][dest]=ftp://user:pass@host/%s/2020-dvm-u10.json"

["ftp_other[0][source]"]
description = "Local source URL (hostname optional) of other files for upload to FTP destination"
scope[] = tournaments
example[] = "ftp_other[0][source]=/2017/dvm-u10/tournament_c24.json"


[pdf_group_line]
description = "Field name to use for group_line in PDF exports"
scope[] = usergroups
example[] = "pdf_group_line=event"
example[] = "pdf_group_line=role"
example[] = "pdf_group_line=usergroup_category"

[tournament]
description = "Event type is a chess tournament (queries, mediadb sync, routing)"
scope[] = categories
subtree[] = events

[tournaments_contact_categories]
description = "Contact types that can participate in this tournament"
scope[] = categories
subtree[] = events
subtree[] = series
list = 1
example[] = "tournaments_contact_categories[0]=club"
example[] = "tournaments_contact_categories[0]=school"
example[] = "tournaments_contact_categories[1]=chess-department"

[tournaments_contact_without_federation]
description = "Contact is not part of a federation"
type = bool
scope[] = contacts

[tournaments_coordinator_mail_to]
description = "E-mail address of tournament coordinator of organisation"
type = mail
scope[] = categories
subtree[] = series
scope[] = tournaments
scope[] = website
example[] = "tournaments_coordinator_mail_to=info@example.org"

[tournaments_dir]
description = "Root folder for tournament data files"
type = folder
default = %%% setting data_dir %%%/tournaments

[tournaments_edition]
description = "Ordinal number of this tournament run (e. g. 3 for the 3rd championship); used on certificates as a prefix instead of the year"
type = int
scope[] = tournaments
example[] = "tournaments_edition=4"
example[] = "tournaments_edition=10"

[tournaments_federation]
description = "Show federation of players or teams in listings"
type = bool
scope[] = categories
subtree[] = events
subtree[] = series
scope[] = tournaments

[tournaments_field_name]
description = "Team registration upload: zzform field_name and file name base"
scope[] = categories
subtree[] = tournament-uploads
example[] = "tournaments_field_name=meldebogen"
example[] = "tournaments_field_name=registration-form"

[tournaments_filemove_begin_before_round_mins]
description = "Time before the start of the round from which the PGN files (header tags) are transferred to the server"
type = int

[tournaments_help_label]
description = "Team registration upload: link text for template PDF"
scope[] = categories
subtree[] = tournament-uploads
example[] = "tournaments_help_label=Ehrenkodex der Deutschen Sportjugend"

[tournaments_help_url]
description = "Team registration upload: URL of template PDF or other help text"
type = url
scope[] = categories
subtree[] = tournament-uploads
example[] = "tournaments_help_url=https://www.deutsche-schachjugend.de/fileadmin/user_upload/Ehrenkodex.pdf"

[tournaments_home_team_first_board]
description = "Colour of player at first board of home team (default black, or white)"
type = select
enum[] = black
enum[] = white
default = black
scope[] = website
scope[] = tournaments
example[] = "tournaments_home_team_first_board=white"

[tournaments_identifier]
description = "Marker for identifiers that they can be used for tournaments"
type = bool
scope[] = categories
subtree[] = identifiers

[tournaments_lineup_before_round_mins]
description = "Time in minutes before a round starts until team organisers have to submit the line-up for the current round. (default: 0, negative values are possible)"
type = int
scope[] = tournaments
example[] = "tournaments_lineup_before_round_mins=15"
example[] = "tournaments_lineup_before_round_mins=999"

[tournaments_live_cache_control_age]
description = "Cache-Control: max-age value for live games (in seconds)"
type = int

[tournaments_live_folders_days]
description = "No. of days before a tournament a folder for live PGNs per tournament is created."
type = int

[tournaments_live_games_show_for_days]
description = "Number of days after the last round when the live games are not shown anymore under the /live-URL"
type = int

[tournaments_live_pgn_delay_mins]
description = "Delay in the publication of PGN files for live broadcasts"
type = int
scope[] = website
scope[] = tournaments
example[] = "tournaments_live_pgn_delay_mins=-105"

[tournaments_live_pgn_offset_mins]
description = "Offset if PGN files are transferred with an incorrect timestamp"
type = int
scope[] = website
scope[] = tournaments

[tournaments_live_round_mins]
description = "Minutes +/- start of round that a round is considered live"
type = int
default = -60
scope[] = tournaments

[tournaments_medal_table]
description = "Include tournament in medal table (Medaillenspiegel); set to 0 to exclude"
type = bool
scope[] = tournaments
example[] = "tournaments_medal_table=0"

[tournaments_nametag_show_team]
description = "Name tag PDF: show team name and number instead of the player's club."
type = bool
scope[] = categories
scope[] = tournaments
subtree[] = series
scope[] = website

[tournaments_no_cards]
description = "Participation status: if set, do not create player or place cards for these players"
type = bool
scope[] = categories
subtree[] = participation-status

[tournaments_path_suffix]
description = "Team registration upload: filename suffix before .pdf, including leading hyphen if needed"
scope[] = categories
subtree[] = tournament-uploads
example[] = "tournaments_path_suffix=-ehrenkodex"

[tournaments_pdf_text_chair]
description = "Text block for PDFs: chair person"
scope[] = tournaments
scope[] = categories
subtree[] = events
subtree[] = series
example[] = "tournaments_pdf_text_chair=Rektor/in der Schule"
example[] = "tournaments_pdf_text_chair=Vereinsvorsitzende/r"
example[] = "tournaments_pdf_text_chair=Vorsitzende/r Verband"

[tournaments_pdf_text_in_org]
description = "Text block for PDFs: in organisation"
scope[] = tournaments
scope[] = categories
subtree[] = events
subtree[] = series
example[] = "tournaments_pdf_text_in_org=im Verband"
example[] = "tournaments_pdf_text_in_org=im Verein"
example[] = "tournaments_pdf_text_in_org=in der Schule"

[tournaments_pgn_bulletin_dir]
description = "Folder for PGN files from bulletin team"
type = folder
default = %%% setting data_dir %%%/tournaments/pgn-bulletin

[tournaments_pgn_bulletin_file_template]
description = "File name template for bulletin files inside series folder inside bulletin folder per tournament (just base name, without .pgn)"
scope[] = tournaments
example[] = "tournaments_pgn_bulletin_file_template=runde%d_U10"
example[] = "tournaments_pgn_bulletin_file_template=runde%d_U25-U12"
example[] = "tournaments_pgn_bulletin_file_template=runde%d_U8"

[tournaments_pgn_dir]
description = "Folder for PGN files per tournament"
type = folder
default = %%% setting data_dir %%%/tournaments/pgn

[tournaments_pgn_live_dir]
description = "Folder for incoming live PGN files"
type = folder
default = %%% setting data_dir %%%/tournaments/pgn-live

[tournaments_pgn_match_round_table_board]
description = "Match Round, (Table, ) Board from PGN Round-tag if there are no matching names. (Important: do not use if PGNs from several tournaments are in one file!)"
type = bool
scope[] = tournaments

[tournaments_pgn_paths]
description = "Path to a PGN file, either on the local server or remote as URL, as a source for live game transmissions"
list = 1
type = path
scope[] = tournaments

[tournaments_pgn_preparation_function]
description = "If you get a PGN file with errors or missing names etc., you can chose to use a function to prepare that PGN file"
scope[] = website
scope[] = tournaments
example[] = "tournaments_pgn_preparation_function=my_chessbase_pgn_board"

[tournaments_pgn_queue_dir]
description = "Folder for PGN queue (intermediate pipeline storage)"
type = folder
default = %%% setting data_dir %%%/tournaments/pgn-queue

[tournaments_player_photos_mediadb]
description = "Year from which on the player photos are saved in mediadb"
type = int
default = 2014

[tournaments_player_pool]
description = "Only allow members of confederation to participate (restrict to federation, club, depending on scope of tournament)"
type = select
scope[] = tournaments
scope[] = categories
subtree[] = events
subtree[] = series
enum[] = confederation
enum[] = federation
enum[] = club
example[] = "tournaments_player_pool=club"

[tournaments_playermessages]
description = "Allow to send messages to each player via a form (for single tournaments)"
type = bool
scope[] = categories
subtree[] = series

[tournaments_playermessages_days_before_end]
description = "Player messages are accepted until this many days before the tournament end date"
type = int
default = 2
scope[] = categories
subtree[] = series
scope[] = tournaments
scope[] = website

[tournaments_playermessages_pdf_column_layout]
description = "PDF export layout for player messages: 1 = first half left, second half right (1|5, 2|6); unset = alternating columns (1|2, 3|4)"
type = int
scope[] = categories
subtree[] = series
scope[] = tournaments
scope[] = website
default = 1

[tournaments_players_compact_max]
description = "Maximum no. of players to show in compact list/standings"
type = int
default = 20

[tournaments_players_compact_max_tolerance]
description = "Tolerance factor for maximum no. of players in compact list (does not make sense to show 20 players but the 21st only on separate page)"
type = number
default = 1.25

["tournaments_rating_link[fide]"]
description = "Link to ratings on website of World Chess Federation (FIDE)"
default = "https://ratings.fide.com/tournament_information.phtml?event=%d"

["tournaments_rating_link[dwz]"]
description = "Link to ratings on website of German Chess Federation (DSB)"
default = "https://www.schachbund.de/turnier/%s.html"

["tournaments_rating_link[dwz_before_2011]"]
description = "Link to ratings on website of German Chess Federation (DSB) for tournaments before 2011"
default = "http://altdwz.schachbund.net/turniere/%d.html?code=%s"

[tournaments_remarks_mail_to]
description = "Send mails with remarks to tournament registrations to this mail address"
type = mail
scope[] = categories
subtree[] = series
scope[] = website
scope[] = tournaments
example[] = "tournaments_remarks_mail_to=info@example.org"

[tournaments_request_address_data]
description = "Request to enter addresses of participants"
type = bool

[tournaments_show_main_archive]
description = "Show archive of main tournament, too"
type = bool
scope[] = categories
subtree[] = series

[tournaments_statistics]
description = "Include tournament in tournament statistics page; set to 0 to exclude"
type = bool
scope[] = tournaments
example[] = "tournaments_statistics=0"

[tournaments_team_league]
description = "Team tournament is a league, e. g. not played en bloc but every n weeks"
type = bool
scope[] = tournaments

[tournaments_teams_dir]
description = "Folder for team files"
type = folder
default = %%% setting data_dir %%%/tournaments/teams

[tournaments_type_single]
description = "It is a single tournament"
type = bool
scope[] = tournaments
scope[] = categories
subtree[] = events

[tournaments_type_team]
description = "It is a team tournament"
type = bool
scope[] = tournaments
scope[] = categories
subtree[] = events

[tournaments_upload_if]
description = "Team registration upload: only show if this field is set in form data (only under tournament-uploads/*)"
scope[] = categories
subtree[] = tournament-uploads
example[] = "tournaments_upload_if=gastspieler"

[tournaments_upload_pgn]
description = "Allow to upload PGN files"
type = bool
default = 1

[tournaments_upload_optional]
description = "Mark team registration upload as non-required"
scope[] = categories
subtree[] = tournament-uploads

; 
; Syntax of this configuration file:
; 
; [key]: setting key
; - Field "description": description, just for information.
; - Field "type": type of setting, e. g. mail, number, foreign_key, etc.
; - Field "default": default value
; - Field "db_field": corresponding database field (table.field)
;

[aks]
description = "Ages for extra age groups (e. g. for open tournaments)"
type = int
list = 1
scope[] = categories
subtree[] = series
example[] = "aks[0]=10"
example[] = "aks[1]=12"
example[] = "aks[2]=14"
example[] = "aks[3]=16"
example[] = "aks[4]=18"

[color]
description = "Color for tournament on badges and player cards, CSS format"
scope[] = categories
subtree[] = series
scope[] = usergroups
example[] = "color=#000000"
example[] = "color=#0066cc"
example[] = "color=#cc0000"
example[] = "color[0]=#0cb8b4"
example[] = "color[Delegationsleiter]=#c0504d"

[chess24_com]
description = "Chess24 tie-break rule for score category (or deprecated tournament JSON key)"
